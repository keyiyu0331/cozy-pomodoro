# Builds the app and publishes it to GitHub Pages every time `main` changes.
# The live site: https://keyiyu0331.github.io/cozy-pomodoro/
#
# You can also run it by hand: GitHub → Actions → "Deploy to GitHub Pages" →
# Run workflow.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What this workflow is allowed to do: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, only the newest one is published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run the tests (a failing test stops the deploy)
        run: npm test

      - name: Build the app into dist/
        run: npm run build

      # GitHub Pages shows 404.html for any address it has no file for.
      # Making it a copy of the app lets /wind-lab open directly.
      - name: Make /wind-lab reachable
        run: cp dist/index.html dist/404.html

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
